name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Info.plist).${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          make dmg VERSION="$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/ScrollFlip-$VERSION.dmg" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
